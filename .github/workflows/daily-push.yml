name: Daily DingTalk exchange-rate report

on:
  schedule:
    - cron: "7 8 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: gold_data.json
          key: gold-${{ github.run_id }}
          restore-keys: gold-
      - name: Update today's gold price
        run: python update_gold.py
      - name: Update today's FX rates and send DingTalk report
        run: python push_dingtalk.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
